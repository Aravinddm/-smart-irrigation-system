<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - Smart Irrigation System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <h1>Smart Irrigation Dashboard</h1>

    <h2>Sensor Reading</h2>
    <p>Moisture Level: <span id="moisture">--</span>%</p>
    <p>Temperature: <span id="temperature">--</span>°C</p>
    <p>Last updated: <span id="reading_time">--</span></p>
    <p>Condition: <span id="moisture_status">--</span></p>

    <h2>Motor Status</h2>
    <p>Status: <span id="motor_status">--</span></p>
    <p>Mode: <span id="motor_mode">--</span></p>

    <button id="motorOnBtn">Turn Motor ON</button>
    <button id="motorOffBtn">Turn Motor OFF</button>

    <script src="js/app.js"></script>
</body>
</html>
